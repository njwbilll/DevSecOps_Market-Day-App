global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Pemeriksaan ketersediaan lewat Nginx (HTTPS, sertifikat self-signed)
  - job_name: blackbox-nginx
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets: ["https://172.20.0.10/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Pemeriksaan langsung ke Backend (melewati Nginx)
  - job_name: blackbox-backend
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets: ["http://172.20.0.20:3000/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
